tasks:
  installDeps:
    name: Install dependencies
    description: Install npm dependencies for the project.
    command: |
      npm install
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Build the production bundle with Vite.
    command: |
      npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  dev-server:
    name: Vite Dev Server
    description: Run the TanStack Start / Vite dev server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --dont-wait --admission creator_only --name "Vite Dev Server"
        ONA_DEV=1 npm run dev -- --host 0.0.0.0
      ready: |
        curl -sf http://localhost:3000 > /dev/null
