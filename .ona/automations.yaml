tasks:
  install-dependencies:
    name: Install dependencies
    command: npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    command: npm run build
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

services:
  development-server:
    name: Development server
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Development server"
        export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$(ona environment port get 3000 -f URL | cut -c 9-)"
        npm run dev -- --host 0.0.0.0
      ready: curl -sf http://localhost:3000
    triggeredBy:
      - manual
      - postEnvironmentStart
