tasks:
  install-dependencies:
    name: Install dependencies
    description: Install the locked npm dependencies.
    command: npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Build the production application.
    command: npm run build
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies

services:
  dev-server:
    name: Dev server
    description: Run the TanStack Start development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Dev server"
        export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$(ona environment port get 3000 -f URL | cut -c 9-)"
        npm run dev -- --host 0.0.0.0
      ready: curl -fsS http://localhost:3000
